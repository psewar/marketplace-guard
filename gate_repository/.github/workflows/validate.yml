# The checks the Marketplace catalog asks for (ADR-0045): the HACS action and hassfest must pass, without ignores, on
# the release that is submitted. Published with the gate repository by tools/publish.py; it runs there, not in the
# development repository.
name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hacs:
    name: HACS action
    runs-on: ubuntu-latest
    steps:
      - name: HACS validation
        uses: hacs/action@main
        with:
          category: integration

  hassfest:
    name: hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: hassfest validation
        uses: home-assistant/actions/hassfest@master
