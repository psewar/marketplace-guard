name: "Marketplace Guard"
version: "2.0.2"
slug: "marketplace_guard"
description: "Security scanning for custom components from Home Assistant's Marketplace, HACS or by hand: automatic quarantine of newly installed components, on-demand repository pre-checks, and an optional AI second opinion. Formerly HACS Guard."
url: "https://github.com/psewar/marketplace-guard"
arch:
  - amd64
  - aarch64
  - armv7
init: false
startup: services
boot: auto
hassio_api: false
homeassistant_api: true
map:
  - homeassistant_config:rw
  - addon_config:rw
options:
  watch_paths:
    - "/homeassistant/custom_components"
    - "/homeassistant/www/community"
  quarantine_dir: "/homeassistant/_marketplace_quarantine"
  quarantine_threshold: "high"
  notify_threshold: "medium"
  notify_services:
    - "persistent_notification"
  scan_python: true
  scan_js: true
  run_bandit: true
  run_pip_audit: true
  fetch_critical: true
  scan_on_start: true
  debounce_seconds: 20
  request_file: "/homeassistant/marketplace_guard/scan_request.txt"
  ha_storage: "/homeassistant/.storage"
  allowlist: []
  rescan_interval_minutes: 360
  max_repo_mb: 50
  status_sensor: true
  status_entity: "sensor.marketplace_guard"
  ai_review: false
  ai_can_quarantine: false
  ai_max_source_kb: 16
  ai_timeout: 120
  quarantine_updates: true
  restart_after_quarantine: false
schema:
  watch_paths:
    - "list(/homeassistant/custom_components|/homeassistant/www/community)"
  quarantine_dir: str
  quarantine_threshold: "list(medium|high|critical)"
  notify_threshold: "list(low|medium|high|critical)"
  notify_services:
    - str
  scan_python: bool
  scan_js: bool
  run_bandit: bool
  run_pip_audit: bool
  fetch_critical: bool
  scan_on_start: bool
  debounce_seconds: int
  request_file: str
  ha_storage: str
  allowlist:
    - str
  rescan_interval_minutes: int
  max_repo_mb: int
  status_sensor: bool
  status_entity: str
  ai_review: bool
  ai_task_entity: "str?"
  ai_task_entity_fallback: "str?"
  ai_can_quarantine: bool
  ai_max_source_kb: int
  ai_timeout: int
  quarantine_updates: bool
  restart_after_quarantine: bool
